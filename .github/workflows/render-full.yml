name: render-full

# Full run film Zombie Apocalypse — 2880 frame total (40 job paralel, 72 frame/job).
# Dipicu manual dari tab Actions. Repo harus PUBLIK supaya menit Actions gratis.
#   9:16  540x960 lensk 0.62: frame Blender 1-1440 (20 job)
#   16:9  960x540 lensk 1.00: frame Blender 1-1440 (20 job)
#   (Frame Blender = plan f + 1; plan f 0-1439.)
#
# Setting B7 (terbukti di render-test.yml): actions/cache Blender 4.5.3,
# download dengan retry loop. JANGAN pakai artifact — total ~2 GB melebihi
# batas gratis 500 MB; tiap job zip frame-nya lalu upload sebagai release
# asset ke release yang namanya diisi di input `release_tag` pakai
# `gh release upload` dengan GITHUB_TOKEN bawaan runner (permissions: contents: write).
# Release-nya DIBUAT DULU dari luar (sebelum trigger) supaya 40 job tidak
# berlomba membuat release yang sama:
#   gh release create <tag-baru> --title "Full run <tanggal>" \
#     --notes "Render penuh film Zombie Apocalypse, 40 chunk paralel."
# JANGAN trigger sebelum render-test lolos (piksel-identik vs lokal).
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Nama release GitHub yang SUDAH dibuat dulu dari luar (40 job upload zip chunk ke sini)"
        required: true
        type: string

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    strategy:
      fail-fast: false
